<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>장사의 신: 얼티밋 대시보드</title>
    <!-- CSS 스타일 파일 연결 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="game-frame">
    <!-- 게임 셋업 화면 -->
    <div id="setup-screen">
        <div style="text-align:center; margin-bottom: 3rem;">
            <h1 style="color:var(--danger); font-size: 4rem; font-weight:900; letter-spacing: -2px; text-shadow: 0 10px 20px rgba(244, 63, 94, 0.3);">장사의 신</h1>
            <p style="color:var(--text-dim); font-size:1.2rem; margin-top:10px;">전략적 운영과 타이밍이 생명인 실전 장사 시뮬레이션</p>
        </div>
        <div class="setup-grid">
            <div class="setup-card"><h4>1. 메뉴 선택</h4><div id="type-list"></div></div>
            <div class="setup-card"><h4>2. 상권 진입</h4><div id="loc-list"></div></div>
            <div class="setup-card"><h4>3. 가격 전략</h4><div id="price-list"></div></div>
        </div>
        <button class="action-btn" style="background:linear-gradient(135deg, var(--danger), #9f1239); max-width: 400px; margin: 0 auto;" onclick="startGame()">가게 계약 및 오픈</button>
    </div>

    <!-- 메인 플레이 화면 -->
    <div id="play-screen" class="hidden" style="height:100%; display:flex; flex-direction:column;">
        <div class="game-header">
            <div class="header-stat">
                <span>진행 상황</span>
                <div style="display:flex; align-items:center; gap:15px;">
                    <b id="day-num" style="color:var(--secondary);">Day 1</b>
                    <div class="progress-container"><div id="progress-bar" class="progress-bar" style="width: 3.33%;"></div></div>
                </div>
            </div>
            <div class="header-stat">
                <span>현재 금고 (초기자본 1,000만)</span>
                <b id="money-display" style="color:var(--accent);">10,000,000</b>
            </div>
        </div>
        
        <div class="main-content">
            <!-- 1단: 조작 및 상태 -->
            <div class="control-panel">
                <!-- 내 매장 정보 패널 -->
                <div class="status-card" style="text-align: left; padding: 1.2rem;">
                    <div style="font-size: 0.85rem; color: var(--text-dim); margin-bottom: 12px; font-weight: bold;">📋 내 매장 정보</div>
                    <div style="display: flex; flex-direction: column; gap: 8px;">
                        <div id="info-type" style="font-size: 1.1rem; font-weight: bold; color: var(--text-main);"></div>
                        <div id="info-loc" style="font-size: 0.95rem; color: var(--text-dim);"></div>
                        <div id="info-price" style="font-size: 0.95rem; color: var(--accent);"></div>
                    </div>
                </div>

                <div class="status-card">
                    <div id="weather-icon" class="weather-icon">☀️</div>
                    <div style="font-size:0.9rem; color:var(--text-dim); margin-bottom:5px;">오늘의 날씨</div>
                    <b id="weather-text" style="font-size:1.1rem;">맑음 (손님 10% 증가)</b>
                    
                    <!-- 업종 시기(Phase) 표시 -->
                    <div id="phase-box" style="margin-top: 15px; border-top: 1px dashed var(--border); padding-top: 10px; text-align:center;">
                        <div style="font-size:0.8rem; color:var(--text-dim); margin-bottom:5px;">현재 업종 시기 효과</div>
                        <div id="phase-text" style="font-weight:bold; font-size:0.95rem; color:var(--accent);">평범한 시기</div>
                    </div>

                    <!-- 활성화된 버프 -->
                    <div id="active-buffs" style="margin-top: 15px; padding-top: 10px; text-align:left;"></div>
                </div>
                
                <div class="status-card" style="flex:1; display:flex; flex-direction:column; justify-content:center;">
                    <button class="action-btn" id="run-btn" onclick="runDay()">오늘의 영업 시작</button>
                </div>
            </div>

            <!-- 2단: 중앙 실시간 로그 -->
            <div id="log-box" class="log-area">
                <div style="text-align:center; color:var(--text-dim); margin-top:20px; opacity:0.5;">- 시스템 로그 -</div>
            </div>

            <!-- 3단: 우측 주간 리포트 영역 -->
            <div class="report-area">
                <h3 style="color:var(--accent); font-size:1rem; margin-bottom:1.5rem; border-bottom:1px solid var(--border); padding-bottom:15px;">📊 주간 실적 리포트</h3>
                <div id="report-list"></div>
            </div>
        </div>
    </div>

    <!-- 모달 오버레이 -->
    <div id="center-overlay" class="overlay">
        <div id="modal-content" class="modal-card"></div>
    </div>
</div>

<!-- 기능 로직 스크립트 연결 (config 통합됨) -->
<script src="script.js"></script>
</body>
</html>
